[project]
name = "adaptation-resilience-utac"
version = "1.0.1"
description = "Real climate adaptation cost-benefit science (Reguero 2018, Global Commission on Adaptation 2019) -- countermeasure modeling, no UTAC/CREP bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/adaptation-resilience-utac"
Repository = "https://github.com/GenesisAeon/adaptation-resilience-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptation_resilience_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=adaptation_resilience_utac --cov-report=term-missing -v"
